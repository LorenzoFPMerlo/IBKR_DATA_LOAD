[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[project]
name = "ibkr-data-load"
version = "0.1.0"
description = "IBKR data loader application and library."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "Lorenzo F.P. Merlo" }
]
dependencies = [
  "ib-insync>=0.9.86",
  "pandas>=2.2.0",
  "pydantic>=2.6.0",
  "pyyaml>=6.0.1",
  "tenacity>=8.2.3",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15.0.0"]

tests = [
  "pytest>=8.0.0",
]

[project.scripts]
load = "ibkr_data_load.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ibkr_data_load"]