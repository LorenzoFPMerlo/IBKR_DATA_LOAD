output_dir: data
logging:
  level: INFO
  json_logs: true
connection:
  host: 127.0.0.1
  port: 4001
  client_id: 1
  connect_timeout_seconds: 10
  max_retries: 5
  retry_backoff_seconds: 1
instruments:
  preferred_exchange: null
  currency: null
  security_types:
    - stock
    - index
    - etf
    - future
    - option
    - bond
historical_bars:
  enabled: true
  bar_size: "1 day"
  what_to_show: "TRADES"
  use_rth: 1
  start_date: null
  end_date: null
  chunk_duration: "1 Y"
  overlap_bars: 5
  min_request_interval_seconds: 1.0
  max_retries: 6
  format_date: 1
options:
  discovery_cache_max_age_hours: 24
  snapshot:
    enabled: false
    max_contracts_per_batch: 50
    sleep_between_batches_seconds: 2.0
    snapshot_wait_seconds: 2.0
    max_expirations: 6
    strike_band_pct: 0.3
    strike_step: 1
    exchange: SMART
historical_ticks:
  enabled: false
  start_date: null
  end_date: null
  chunk_seconds: 3600
  max_ticks_per_request: 1000
  min_request_interval_seconds: 1.0
  max_retries: 4