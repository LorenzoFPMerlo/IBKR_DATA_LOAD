name: ibload
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip>=24,<26

  # Core
  - numpy=1.26.*
  - pandas=2.2.*
  - pyarrow=16.*          # optional but recommended for big option surfaces
  - pyyaml=6.*
  - python-dotenv=1.*
  - tqdm=4.*
  - tzdata               # important for Windows timezone completeness
  - filelock=3.*         # optional but useful for Windows file safety

  # Quality / calendars (choose one)
  - exchange-calendars=4.*   # recommended

  # Logging / CLI (can be conda or pip; keep consistent)
  - loguru=0.7.*
  - pytest>=7.4,<9

  # Broker / scheduling
  - ib-insync=0.9.*
  - apscheduler=3.*

  - pip:
      - pydantic>=2,<3
      - tenacity>=8,<9
      - typer>=0.12,<1
      - rich>=13,<14
      # If you ever need explicit official API pin:
      # - ibapi==9.81.1.post1

